[Rainmeter]
Author=Xyrfo and fediaFedia
Update=86400000
Blur=1
MouseActionCursor=0
BlurRegion=2,0,0,670*#scaledpi#,280*#scaledpi#,35
Group=Widget
MiddleMouseUpAction=!DeactivateConfig
OnRefreshAction=[!SnapEdges 0 BigSur\Gallery]

MouseScrollUpAction=!ActivateConfig "wp7\gallery" "thankyou.ini"
MouseScrollDownAction=!ActivateConfig "wp7\gallery" "installed.ini"




[Metadata]
Version=6.0
Information=Panel Gallery
License=Creative Commons Attribution-NonCommercial-NoDerivs 3.0


[Variables]
LastCat=Widgets
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
title=1

rss-en=http://rss.cnn.com/rss/edition.rss
rss-ru=http://lenta.ru/rss/news
rss-de=https://www.n-tv.de/rss
rss-es=http://ep00.epimg.net/rss/tags/noticias_mas_vistas.xml
rss-nl=https://www.ad.nl/nieuws/rss.xml
rss-fr=https://www.lemonde.fr/rss/une.xml
rss-pt=https://www.noticiasaominuto.com/rss/ultima-hora


[Background]
Meter=Image
imagename=#@#\bg#DarkMode#.png
h=(280)*#scaledpi#
w=(670)*#scaledpi#




@include3=#LastCat#.inc




[Side]
FontColor=#textcolor2#,200
FontFace=#ThemeFont#
FontSize=(12)*#scaledpi#
StringAlign=LEFT

AntiAlias=1
solidcolor=0,0,0,1
Y=(4)*#scaledpi#R
x=r
LeftMouseUpAction=[!WriteKeyValue Variables LastCat #CURRENTSECTION#][!Refresh #currentconfig#]
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,255][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,200][!Update]



[Widgets]
Meter=String
Y=(65)*#scaledpi#
x=(25)*#scaledpi#
MeterStyle=Side
Text=#Widgets#

[Shortcuts]
Meter=String
MeterStyle=Side
Text=#Shortcuts#

[Web]
Meter=String
MeterStyle=Side
Text=#Web#

[Extras]
Meter=String
MeterStyle=Side
Text=#Extras#

[Settings]
Meter=String
MeterStyle=Side
Text=#Settings#

[About]
Meter=String
MeterStyle=Side
Text=#About#

[donate]
meter=image
x=(25)*#scaledpi#
y=(220)*#scaledpi#
w=(120)*#scaledpi#
imagename=#@#\Graphics\Gallery\Donate#DarkMode#.png

tooltiptitle=Donate to support the development!
ToolTipText=We will send you a small collection of extra widgets as a reward :)
LeftMouseUpAction=!execute ["https://www.paypal.com/cgi-bin/webscr?cmd=_donations&business=fedia1%40gmail.com&item_name=Support+the+Development&currency_code=USD&source=url"]



[close]

Meter=Image
LeftMouseUpAction=!DeactivateConfig
imagename=#@#\close.png
x=(25)*#scaledpi#
y=(25)*#scaledpi#
imagetint=#textcolor2#
w=(25)*#scaledpi#
h=(25)*#scaledpi#
LeftMouseUpAction=!DeactivateConfig
imagealpha=200
MouseOverAction=[!SetOption #CURRENTSECTION# imagealpha 255][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# imagealpha 200][!Update]
