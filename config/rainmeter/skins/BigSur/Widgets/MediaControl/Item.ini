[Rainmeter]
DragGroup=BigSur
Group=Widget
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(10-#Padding#),(10-#Padding#),161*#scaledpi#,161*#scaledpi#,#blurcornerradius#

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.0
Information=BigSur for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#Remote#
height=150

ActionToTake=[Play "#SoundFile#"]









[TextStyle]
FontFace=#ThemeFont#
FontSize=11
FontColor=255,255,255,255
AntiAlias=1
DynamicVariables=1


[SolidStyle]
W=(60)*#scaledpi#
h=(60)*#scaledpi#
Group=Initial

[measurefunnythings]
Measure=Calc
Formula=-1*#showcircle#+1

[ipod]
Meter=Image
MeterStyle=Full
imagename=#@#\Graphics\Music\ipod.png

ImageTint=#textcolor2#
Hidden=#showcircle#


[SolidMask]
Meter=Image
MeterStyle=Full
imagename=#@#\Graphics\Music\grid1.png

ImageTint=#colorskin#
Hidden=#showcircle#
DynamicVariables=1

[SolidEsk]
Meter=Image
MeterStyle=Full
imagename=#@#\Graphics\Music\grid2.png
ImageTint=#textcolor2#
Hidden=#showcircle#
DynamicVariables=1


[SolidEsk2]
Meter=Image
MeterStyle=Full
imagename=#@#\Graphics\Music\grid.png
ImageTint=#textcolor2#
Hidden=[measurefunnythings]
DynamicVariables=1
