[Rainmeter]
DragGroup=BigSur
Group=Widget
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(10-#Padding#),(10-#Padding#),161*#scaledpi#,161*#scaledpi#,#blurcornerradius#

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=[#EditManually#"notepad.exe" "#currentpath#UserVariables.inc"]["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]


ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.0
Information=BigSur for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]


Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#Photos#


[Random]
Measure=Plugin
Plugin=Plugins\QuotePlugin.dll
PathName=#PicturesFolder#
Subfolders=#subfolders#
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp

[Image]
MeasureName=Random
Meter=Image
w=(140)*#scaledpi#
h=(140)*#scaledpi#
x=(15)*#scaledpi#
y=(15)*#scaledpi#
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp
PreserveAspectRatio=#KeepAspectRatio#

[Act]
Meter=Image
MeterStyle=ActStyle
LeftMouseUpAction=["#PicturesFolder#"]
w=(140)*#scaledpi#
h=(140)*#scaledpi#
x=(15)*#scaledpi#
y=(15)*#scaledpi#

[bgc]
meter=image
meterstyle=full
imagename=rounded.png
imagetint=#colorskin#
