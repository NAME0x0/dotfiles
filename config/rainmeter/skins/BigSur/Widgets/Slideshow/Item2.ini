[Rainmeter]
DragGroup=BigSur
Group=Widget
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=0
BlurRegion=2,(10-#Padding#),(10-#Padding#),201*#scaledpi#,201*#scaledpi#,#blurcornerradius#

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.0
Information=BigSur for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]

Type=Double
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name='"AESTHETICS"'

; --- Local aesthetic overrides (Off-White x Space Grey x NASA Orange) ---
colorskin=28,28,30
textcolor2=240,237,232

; --- 25% size increase: 320->400, 150->188 ---
wBase=440
hBase=207


[Random]
Measure=Plugin
Plugin=Plugins\QuotePlugin.dll
PathName=#PicturesFolder#
Subfolders=#subfolders#
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp

; --- Override structure meters for 25% size increase ---
[solA]
solidcolor=28,28,30,1
W=(#wBase#+(10-#Padding#)*2)*#ScaleDpi#
H=(#hBase#+(10-#Padding#)*(3-#HideLabels#))*#ScaleDpi#

[bgE]
W=(#wBase#)*#ScaleDpi#
H=(#hBase#)*#ScaleDpi#
ImageAlpha=180

[Full]
W=(#wBase#)*#ScaleDpi#
H=(#hBase#)*#ScaleDpi#

[Image]
MeasureName=Random
Meter=Image
w=(#wBase#-10)*#scaledpi#
h=(#hBase#-12)*#scaledpi#
x=(15)*#scaledpi#
y=(15)*#scaledpi#
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp
PreserveAspectRatio=2

[Act]
Meter=Image
MeterStyle=ActStyle
LeftMouseUpAction=["#PicturesFolder#"]
w=(#wBase#-10)*#scaledpi#
h=(#hBase#-12)*#scaledpi#
x=(15)*#scaledpi#
y=(15)*#scaledpi#

[bgc]
meter=image
meterstyle=full
imagename=double.png
imagetint=#colorskin#

; --- Label styling override ---
[FontStyle]
fontcolor=240,237,232
fontSize=12

[Text]
FontColor=252,61,33,200
x=((#wBase#/2+(10-#Padding#)))*#scaledpi#
w=(#wBase#)*#scaledpi#
