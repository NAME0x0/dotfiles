[Rainmeter]
DragGroup=BigSur
Group=Widget
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=1000

Blur=#globalblurenable#
BlurRegion=2,(10-#Padding#),(10-#Padding#),161*#scaledpi#,161*#scaledpi#,#blurcornerradius#

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.0
Information=BigSur for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]
Type=Double
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#Player#
Height=150
redcolor=30,200,100


[MeasureProgress]
Measure=Plugin
Plugin=SpotifyPlugin
Type=Progress



[mArtist]
Measure=Plugin
Plugin=SpotifyPlugin
Type=ArtistName

[mAlbum]
Measure=Plugin
Plugin=SpotifyPlugin
Type=AlbumName

[mCover]
Measure=Plugin
Plugin=SpotifyPlugin
Type=AlbumArt
Res=300
DefaultPath="#@#Graphics\Music\Default.png"
CoverPath=#@#Cover.png



[Style]
StringAlign=CENTER
StringStyle=Normal
FontColor=255,255,255
FontFace=#ThemeFont#
AntiAlias=1








[Buttons]
W=((#Height#/6))*#scaledpi#
H=((#Height#/6))*#scaledpi#
ImageTint=#textcolor2#,#paneltitleopacity#
MouseActionCursor=1


[MusicICon]
Meter=Image
ImageName=#@#\Graphics\Web\Spotify.png
x=(290)*#scaledpi#
y=(120)*#scaledpi#
w=(25)*#scaledpi#
h=(25)*#scaledpi#
LeftMouseUpAction=['%APPDATA%\Spotify\Spotify.exe']
MouseActionCursor=1


[MeterAlbumd]
Meter=Image
MeasureName=mCover
MeterStyle=Full
x=(25)*#scaledpi#
y=(25)*#scaledpi#
w=(120)*#scaledpi#
h=(120)*#scaledpi#
ImageName="%1"
ToolTipTitle=[mAlbum]
ToolTipText=[mArtist]#CRLF#[mPlayer]#CRLF#---#CRLF#Double click for next song
DynamicVariables=1

[MeterAlbumMask]
Meter=Image
ImageName=#@#\Graphics\Music\mask.png
x=(25)*#scaledpi#
y=(25)*#scaledpi#
w=(120)*#scaledpi#
h=(120)*#scaledpi#
imagetint=#colorskin#

[song]
Meter=String
StringStyle=NORMAL
MeasureName=mPlayer
StringAlign=LEFT
AntiAlias=1
W=((#Height#-20))*#scaledpi#
H=((#Height#/8))*#scaledpi#
X=(160*#scaledpi#)
ClipString=2
Y=(30*#scaledpi#)
FontColor=#textcolor2#
FontSize=((#Height#/16))*#scaledpi#

[artist]
Meter=String
StringStyle=NORMAL
MeasureName=mArtist
StringAlign=LEFT
AntiAlias=1
W=((#Height#-20))*#scaledpi#
H=((#Height#/8))*#scaledpi#
X=r
ClipString=1
Y=-2R
FontColor=#redcolor#
FontSize=((#Height#/16))*#scaledpi#

[album]
Meter=String
StringStyle=NORMAL
MeasureName=mAlbum
StringAlign=LEFT
AntiAlias=1
W=((#Height#-20))*#scaledpi#
H=((#Height#/8))*#scaledpi#
X=r
ClipString=1
Y=-2R
FontColor=#textcolor2#,100
FontSize=((#Height#/16))*#scaledpi#





[ButtonsE]
W=((#Height#/6))*#scaledpi#
H=((#Height#/6))*#scaledpi#
ImageTint=#textcolor2#
MouseActionCursor=1



[Prev]
Meter=Image
ImageName=#@#Graphics\Music\Prev.png
X=(160)*#scaledpi#
Y=(120)*#scaledpi#
LeftMouseUpAction=[!CommandMeasure "MeasureProgress" "Previous"]
MeterStyle=ButtonsE
imagetint=#redcolor#
[Play]
Meter=Image
ImageName=#@#Graphics\Music\playpause.png
DynamicVariables=1
X=R
W=((#Height#/4.2857))*#scaledpi#
H=((#Height#/4.2857))*#scaledpi#
Y=(-5)*#scaledpi#r
LeftMouseUpAction=[!CommandMeasure "MeasureProgress" "PlayPause"]
MeterStyle=ButtonsE
imagetint=#redcolor#
[Next]
Meter=Image
ImageName=#@#Graphics\Music\Next.png
X=R
Y=(5)*#scaledpi#r
LeftMouseUpAction=[!CommandMeasure "MeasureProgress" "Next"]
MeterStyle=ButtonsE
imagetint=#redcolor#