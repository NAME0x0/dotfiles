[Rainmeter]
DragGroup=BigSur
Group=Widget
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=1000000

MouseOverAction=[!ShowMeter Play][!Redraw]
MouseLeaveAction=[!HideMeter Play][!Redraw]
Blur=#globalblurenable#
BlurRegion=2,(10-#Padding#),(10-#Padding#),161*#scaledpi#,161*#scaledpi#,#blurcornerradius#

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.0
Information=BigSur for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=#@#Config\Widgets\Clock\UserVariables.inc
Name=Stocks
Height=150




[MeasureSite]
Measure=WebParser
URL=https://www.cnbc.com/quotes/?symbol=AAPL
RegExp=(?siU)'last','extend')">(.*)


[Name]
Measure=WebParser
URL=[MeasureSite]
StringIndex=1
Download=1
FinishAction=[!Update]

[Value]
Measure=WebParser
URL=[MeasureSite]
StringIndex=2

[ValueChange]
Measure=WebParser
URL=[MeasureSite]
StringIndex=3



[Buttons]
W=((#Height#/6))*#scaledpi#
H=((#Height#/6))*#scaledpi#
ImageTint=#textcolor2#,#paneltitleopacity#
MouseActionCursor=1




[StockSymbol]
Meter=String
StringStyle=BOLD
MeasureName=Name
StringAlign=LEFT
AntiAlias=1
W=((#Height#-20))*#scaledpi#
H=((#Height#/8))*#scaledpi#
X=20
ClipString=1
Y=20
FontColor=#textcolor2#
FontSize=((#Height#/16))*#scaledpi#
Text=AAPL

[StockName]
Meter=String
StringStyle=NORMAL
MeasureName=Name
StringAlign=LEFT
AntiAlias=1
W=((#Height#-20))*#scaledpi#
H=((#Height#/8))*#scaledpi#
X=20
ClipString=1
Y=R
FontColor=#textcolor2#,150
FontSize=((#Height#/16))*#scaledpi#
Text=Apple Inc


[StockChange]
Meter=String
StringStyle=NORMAL
MeasureName=Name
StringAlign=RIGHT
AntiAlias=1
W=((#Height#))*#scaledpi#
H=((#Height#/8))*#scaledpi#
X=(#Height#)
ClipString=1
Y=20
FontColor=#redcolor#
FontSize=((#Height#/16))*#scaledpi#
Text=-1.19 (-0.26%)


[img]
Meter=image
imagename=#darkmode#.png
x=25
y=60
w=120

[StockValue]
Meter=String
StringStyle=NORMAL
MeasureName=Name
StringAlign=center
AntiAlias=1

X=85
ClipString=1
Y=110
FontColor=#textcolor2#
FontSize=((#Height#/6.5))*#scaledpi#
Text=450.85