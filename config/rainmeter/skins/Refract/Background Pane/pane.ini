[Rainmeter]
Update=-1
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Variables]
@include=#@#settings.inc

[MeterPane]
Meter=Image
X=0
Y=0
W=1220
H=562
SolidColor=20,20,22,180

[MeterBorderTop]
Meter=Shape
Shape=Path Top | StrokeWidth 1 | Stroke Color #AccentColor# | Fill Color 0,0,0,0
Top = 5,5 | LineTo 1212,5 | LineTo 1212,15
UpdateDivider=-1

[MeterBorderBottom]
Meter=Shape
Shape=Path Bottom | StrokeWidth 1 | Stroke Color #AccentColor# | Fill Color 0,0,0,0
Bottom = 5,545 | LineTo 5,555 | LineTo 1212,555
UpdateDivider=-1
