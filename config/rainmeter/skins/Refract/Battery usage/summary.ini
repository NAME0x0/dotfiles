[Rainmeter]
Update=1000
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Metadata]
Name=Battery
Author=Immanuel Smith
Information=Battery percentage and information
License=Creative Commons BY-NC-SA 3.0
Version=1.0

[measureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[measureData]
Measure=String
String=""

[measureStatus]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=ACLine
Substitute= "1":"CHARGING", "0":"DISCHARGING"

[measureStatus2]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=ACLine
Substitute= "1":"+", "0":"%"

[measureTimeRemain]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=LIFETIME
Format="%#H:%M Remain"
Substitute= "Unknown":"--:--"
UpdateDivider=5


[Variables]
@include=#@#settings.inc
scale=0.69
@include2=#@#Styles\styles.inc
title=BATTERY
unit=%
percentual=0
width=400
height=120
@include3=#@#Styles\skeleton_local.inc

[meterLine]
Meter=Line
W=0
H=0


[meterBattery]
Meter=String
MeasureName=measureBattery
measureName2=measureStatus2
MeterStyle=StyleMainText
FontFace=Moongloss Display Thin
X=(155*#scale#)
Y=(44*#scale#)
W=(105*#scale#)
H=(60*#scale#)
Text=%1
fontsize=(45*#scale#)
StringAlign=right
Percentual=#percentual#
AutoScale=#autoscale#
NumOfDecimals=0

[meterData1]
Meter=String
MeterStyle=StyleSecondText
MeasureName=measureStatus
FontColor=#GraphColor#
X=(155*#scale#)
Y=(52*#scale#)
W=(100*#scale#)
H=(20*#scale#)
Text=%1
FontSize=(12*#scale#)
StringCase=Upper

[meterData2]
Meter=String
MeterStyle=StyleSecondText
MeasureName=measureTimeRemain
FontColor=#GraphColor#
X=(155*#scale#)
Y=(78*#scale#)
W=(100*#scale#)
H=(25*#scale#)
Text=%1
FontSize=(12*#scale#)
Percentual=#percentual#
StringCase=Upper

