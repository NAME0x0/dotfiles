[Rainmeter]
Update=1000
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2
OnRefreshAction=[!CommandMeasure MeasureLogicalProcessors "Run"]

[Metadata]
Name=CPU usage
Author=smithxtt
Information=CPU usage
License=Creative Commons BY-NC-SA 3.0
Version=1.0


[Variables]
@include=#@#settings.inc
; Local override: 1.5x larger than the pack default scale of 0.6.
scale=0.9
@include2=#@#Styles\styles.inc
title=
title2=
unit=%
autoscale=0
width=900
height=700
min_radius=(94*#scale#)
factor=(1.4*#scale#)

[MeterBackground0]
Meter=Image
X=0
Y=0
W=(#width#*#scale#)
H=(#height#*#scale#)
SolidColor=200,200,200,1
UpdateDivider=-1

[MeterBackground1]
Meter=Image
X=(5*#scale#)
Y=(5*#scale#)
W=((#width#-10)*#scale#)
H=((#height#-10)*#scale#)
SolidColor=#BGColor#
UpdateDivider=-1

[MeterTitle]
Meter=String
FontColor=#AccentColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(5*#scale#)
Y=(5*#scale#)
W=(130*#scale#)
H=(15*#scale#)
FontSize=(10*#scale#)
Text=#title#
StringCase=Upper
UpdateDivider=-1

[MeterTitle2]
Meter=String
FontColor=#HighlightTextColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(5*#scale#)
Y=(5*#scale#)
W=(120*#scale#)
H=(15*#scale#)
FontSize=(10*#scale#)
Text=#title2#
StringCase=Upper
UpdateDivider=-1

[MeasureLogicalProcessors]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -command "Get-WmiObject -class Win32_processor | Select NumberOfLogicalProcessors -expandproperty NumberOfLogicalProcessors"
OutputType=ANSI
RegExpSubstitute=1
;Substitute="(?siU)^.*NumberOfLogicalProcessors=([\d]{1,2})":"\1","#CRLF#":""
FinishAction=[!CommandMeasure "meterScript" "Initialize()"]


[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
UpdateDivider=-1

[measureColor2]
Measure=String
String=#GraphColor#.
Substitute=",255.":",160"

[measureColor3]
Measure=String
String=#GraphColor#.
Substitute=",255.":",80"

[MeterDotsMask]
Meter=Image
X=0
Y=0
W=(674*#scale#)
H=(487*#scale#)
ImageName=mask.png

[MeterDots]
Meter=Image
X=(12*#scale#)
Y=(12*#scale#)
W=(674*#scale#)
H=(487*#scale#)
ImageName=dots.png
Tile=1
Greyscale=1
Imagetint=#AccentColor#
Container=MeterDotsMask
UpdateDivider=-1


[MeterCPUName]
Meter=String
MeasureName=MeasureCPUName
FontColor=#HighlightTextColor#
FontFace=Moongloss Display Thick
AntiAlias=1
x=(9*#scale#)
y=(12*#scale#)
w=(75*#scale#)
h=(9*#scale#)
FontSize=(11*#scale#)
Text=%1
StringCase=Upper

[MeasureUptime]
Measure=Uptime
Format="%4!i! DAYS, %3!02i!:%2!02i!:%1!02i!"


[meterUptime]
Meter=String
MeterStyle=StyleSecondText
StringCase=Upper
MeasureName=MeasureUptime
FontColor=#GraphColor#
X=(683*#scale#)
Y=(477*#scale#)
W=(19*#scale#)
H=(9*#scale#)
FontSize=(11*#scale#)
Text=UPTIME: %1
StringAlign=right


@include=cores.inc


[meterShapes]
Meter=Shape
X=(350*#scale#)
Y=(250*#scale#)
DynamicVariables=1
Shape=Path MyPath | StrokeWidth (3*#scale#) | Stroke Color #GraphColor# | Fill Color 0,0,0,0
Shape2=Path MyPath2 | StrokeWidth (2*#scale#) | Stroke Color [measureColor2] | Fill Color 0,0,0,0
Shape3=Path MyPath3 | StrokeWidth (1*#scale#) | Stroke Color [measureColor3] | Fill Color 0,0,0,0

MyPath = 
MyPath2 = 
MyPath3 = 



[meterFrame]
Meter=Shape
X=0
Y=0
UpdateDivider=-1
Shape=Path MyPath | StrokeWidth (1*#scale#) | Stroke Color #AccentColor# | Fill Color 0,0,0,0
Shape2=Path MyPath2 | StrokeWidth (1*#scale#) | Stroke Color #AccentColor# | Fill Color 0,0,0,0
;10*#scale#),(20*#scale#) | LineTo
MyPath = (6*#scale#),(6*#scale#) | LineTo (686*#scale#),(6*#scale#) | LineTo (686*#scale#),(19*#scale#)
MyPath2= (6*#scale#),(481*#scale#) | LineTo (6*#scale#),(493*#scale#) | LineTo (686*#scale#),(493*#scale#)
;| LineTo (1100*#scale#),(780*#scale#)


[meterScript]
Measure=Script
ScriptFile=heatmap.lua




