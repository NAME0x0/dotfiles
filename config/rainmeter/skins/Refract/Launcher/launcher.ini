[Rainmeter]
Update=-1
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Variables]
@include=#@#settings.inc
@include2=#@#Styles/styles.inc
width=630
height=360

; ── Directories ──
Dir1=D:\
Dir2=__USERPROFILE__\OneDrive\Documents
Dir3=__USERPROFILE__\Documents
Dir4=__USERPROFILE__\OneDrive\Desktop

; ── Background ──
[MeterBG]
Meter=Image
X=0
Y=0
W=(#width#*#scale#)
H=(#height#*#scale#)
SolidColor=0,0,0,1
UpdateDivider=-1

[MeterBorder]
Meter=Shape
MeterStyle=StyleMeterBorder
Shape=Path MyPath | StrokeWidth #scale# | Stroke Color #AccentColor# | Fill Color 0,0,0,0
Shape2=Path MyPath2 | StrokeWidth #scale# | Stroke Color #AccentColor# | Fill Color 0,0,0,0
MyPath = (5*#scale#),(10*#scale#) | LineTo ((#width#-5)*#scale#),(10*#scale#) | LineTo ((#width#-5)*#scale#),(20*#scale#)
MyPath2= (5*#scale#),((#height#-20)*#scale#) | LineTo (5*#scale#),((#height#-10)*#scale#) | LineTo ((#width#-5)*#scale#),((#height#-10)*#scale#)
UpdateDivider=-1

; ── Title ──
[MeterTitle]
Meter=String
FontColor=#HighlightTextColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(10*#scale#)
Y=(15*#scale#)
FontSize=(18*#scale#)
Text=QUICK LAUNCH
StringCase=Upper
UpdateDivider=-1

; ═══════════════════════════════════════
; ROW 1: Home (~)
; ═══════════════════════════════════════
[MeterDir1Label]
Meter=String
FontColor=#NormalTextColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(10*#scale#)
Y=(50*#scale#)
FontSize=(15*#scale#)
Text=D DRIVE
StringCase=Upper
UpdateDivider=-1

[MeterDir1Yazi]
Meter=String
FontColor=#AccentColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(250*#scale#)
Y=(50*#scale#)
FontSize=(15*#scale#)
Text=YAZI
StringCase=Upper
UpdateDivider=-1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor #HighlightTextColor#][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor #AccentColor#][!UpdateMeter #CURRENTSECTION#][!Redraw]
LeftMouseUpAction=["wt" "-w" "new" "--title" "yazi" "yazi" "#Dir1#"]

[MeterDir1Claude]
Meter=String
FontColor=#AccentColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(320*#scale#)
Y=(50*#scale#)
FontSize=(15*#scale#)
Text=CLAUDE
StringCase=Upper
UpdateDivider=-1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor #HighlightTextColor#][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor #AccentColor#][!UpdateMeter #CURRENTSECTION#][!Redraw]
LeftMouseUpAction=["wt" "-w" "new" "--title" "claude" "cmd" "/k" "cd /d #Dir1# && claude"]

[MeterDir1Codex]
Meter=String
FontColor=#AccentColor#
FontFace=Moongloss Display Thick
AntiAlias=1
X=(410*#scale#)
Y=(50*#scale#)
FontSize=(15*#scale#)
Text=CODEX
