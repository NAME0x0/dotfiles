[Rainmeter]
Update=-1
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Metadata]
Name=My Folders
Author=Immanuel Smith
Information=User folders
License=Creative Commons BY-NC-SA 3.0
Version=1.0

[Variables]
@include=#@#settings.inc
scale=0.69
@include2=#@#Styles\styles.inc
title=
title2=FOLDERS
width=400
height=190
autoscale=0
@include3=#@#Styles\background_local.inc



[MeasureUser]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME
UpdateDivider=-1


[meterMask1]
Meter=Shape
X=(5*#scale#)
Y=(30*#scale#)
MeterStyle=StyleMask

[meterBorder1]
Meter=Shape
MeterStyle=StyleBorder

[meterData1]
Meter=String
MeterStyle=StyleButton
MeasureName=MeasureUser
Text=%1
LeftMouseUpAction=%userprofile%
Container=meterMask1




[meterMask2]
Meter=Shape
X=(10*#scale#)R
Y=0r
MeterStyle=StyleMask



[meterData2]
Meter=String
MeterStyle=StyleButton
Text=DESKTOP
LeftMouseUpAction=%userprofile%\Desktop
Container=meterMask2

[meterBorder2]
X=0r
Y=0r
Meter=Shape
MeterStyle=StyleBorder

[meterMask3]
Meter=Shape
X=(5*#scale#)
Y=(8*#scale#)R
MeterStyle=StyleMask

[meterBorder3]
Meter=Shape
MeterStyle=StyleBorder

[meterData3]
Meter=String
MeterStyle=StyleButton
Text=DOCUMENTS
LeftMouseUpAction=%userprofile%\Documents
Container=meterMask3

[meterMask4]
Meter=Shape
X=(10*#scale#)R
Y=0r
MeterStyle=StyleMask

[meterBorder4]
Meter=Shape
MeterStyle=StyleBorder

[meterData4]
Meter=String
MeterStyle=StyleButton
Text=DOWNLOADS
LeftMouseUpAction=%userprofile%\Downloads
Container=meterMask4

[meterMask5]
Meter=Shape
X=(5*#scale#)
Y=(8*#scale#)R
MeterStyle=StyleMask

[meterBorder5]
Meter=Shape
MeterStyle=StyleBorder

[meterData5]
Meter=String
MeterStyle=StyleButton
Text=MUSIC
LeftMouseUpAction=%userprofile%\music
Container=meterMask5

[meterMask6]
Meter=Shape
X=(10*#scale#)R
Y=0r
MeterStyle=StyleMask

[meterBorder6]
Meter=Shape
MeterStyle=StyleBorder

[meterData6]
Meter=String
MeterStyle=StyleButton
Text=PICTURES
LeftMouseUpAction=%userprofile%\pictures
Container=meterMask6

[meterMask7]
Meter=Shape
X=(5*#scale#)
Y=(8*#scale#)R
MeterStyle=StyleMask

[meterBorder7]
Meter=Shape
MeterStyle=StyleBorder

[meterData7]
Meter=String
MeterStyle=StyleButton
Text=VIDEOS
LeftMouseUpAction=%userprofile%\videos
Container=meterMask7

[meterMask8]
Meter=Shape
X=(10*#scale#)R
Y=0r
MeterStyle=StyleMask

[meterBorder8]
Meter=Shape
MeterStyle=StyleBorder

[meterData8]
Meter=String
MeterStyle=StyleButton
Text=TRASH
LeftMouseUpAction=[shell:RecycleBinFolder]
Container=meterMask8
