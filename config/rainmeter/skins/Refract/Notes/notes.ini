[Rainmeter]
Update=10000
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Metadata]
Name=Todo list
Author=Immanuel Smith
Information=Notes widget
License=Creative Commons BY-NC-SA 3.0
Version=1.0


[Variables]
@include=#@#settings.inc
scale=0.69
@include2=#@#Styles\styles.inc
title=
title2=Notes
width=400
height=270
autoscale=0
@include3=#@#Styles\background_local.inc

[MeasureData]
Measure=Script
ScriptFile=#@#Scripts\file.lua
FileToRead=%userprofile%\notes.txt


[meterData]
Meter=String
MeasureName=measureData
MeterStyle=StyleSecondText
FontSize=(11*#scale#)
StringCase=None
FontFace=Roboto
X=(10*#scale#)
Y=(25*#scale#)
W=(370*#scale#)
H=(235*#scale#)
Text=%1
ClipString=1
LeftMouseUpAction=["C:\Windows\Notepad.exe" %userprofile%\notes.txt]
