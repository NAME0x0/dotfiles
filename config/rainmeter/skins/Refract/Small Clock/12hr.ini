[Rainmeter]
Update=1000
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Metadata]
Name=Small digital clock
Author=Immanuel Smith
Information=Displays the current date and time in 12hrs.
License=Creative Commons BY-NC-SA 3.0
Version=1.0

[Variables]
@include=#@#settings.inc
scale=0.69
@include2=#@#Styles/styles.inc
@include3=#@#Styles/time_small.inc


[measureData]
Measure=Time
Format=%I:%M

[measureDate1]
Measure=Time
Format=%a %d

[measureDate2]
Measure=Time
Format=%b %Y
