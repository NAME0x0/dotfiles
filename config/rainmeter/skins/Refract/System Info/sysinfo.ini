[Rainmeter]
Update=1000
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Metadata]
Name=Notes
Author=Immanuel Smith
Information=Notes widget
License=Creative Commons BY-NC-SA 3.0
Version=1.0


[Variables]
@include=#@#settings.inc
scale=0.69
@include2=#@#Styles\styles.inc
title=
title2=
title3=SYS_INFO
autoscale=0
width=400
height=120
Alert1=
Alert2=
Alert3=
@include3=#@#Styles\background_local.inc

[MeterBorder]
Meter=Shape
MeterStyle=StyleMeterBorder

[MeterTitle3]
Meter=String
FontColor=#AccentColor#
FontFace=Moongloss Display Thick
AntiAlias=1
x=(8*#scale#)
y=(15*#scale#)
w=(130*#scale#)
h=(15*#scale#)
FontSize=(10*#scale#)
Text=#title3#
StringCase=Upper
UpdateDivider=-1

[meterNominal]
Meter=String
MeterStyle=StyleSecondText
StringCase=Upper
X=(200*#scale#)
Y=(60*#scale#)
W=(300*#scale#)
H=(75*#scale#)
FontSize=(14*#scale#)
FontColor=#HighlightTextColor#
Text=ALL SYSTEMS NOMINAL
StringAlign=centercenter

[measureMessage]
Measure=String
String=#Alert1##Alert2##Alert3#
RegExpSubstitute=1
Substitute=",$":""
IfMatch=.
IfMatchAction=[!ShowMeter meterAlertBox][!Redraw]
IfNotMatchAction=[!HideMeter meterAlertBox][!Redraw]
IfMatchMode=1
DynamicVariables=1

[meterAlertBox]
Meter=Shape
X=(10*#scale#)
Y=(40*#scale#)
Shape=Rectangle 0, 0, (380*#scale#),(60*#scale#),(2*#scale#) | Fill Color 60,0,0,255 | StrokeWidth (1.5*#scale#) | StrokeColor 255,0,0,2550

[meterAlert]
Meter=String
MeasureName=measureMessage
X=(190*#scale#)r
Y=(30*#scale#)r
W=(400*#scale#)
H=(70*#scale#)
FontSize=(14*#scale#)
FontColor=255,240,240,255
FontFace=MoonGloss Display thick
SolidColor=255,0,0,0
StringCase=upper
StringAlign=centercenter
ClipString=1
AntiAlias=1
Text=%1
DynamicVariables=1


[measureCPU]
Measure=CPU
Processor=0
IfAboveValue=80
IfAboveAction=[!SetVariable Alert1 "CPU high,"]
IfBelowValue=81
IfBelowAction=[!SetVariable Alert1 ""]

[MeasurePhysMemTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=3600

[measureMemory]
Measure=PhysicalMemory
Percentual=1
AverageSize=2
IfCondition=(measureMemory / MeasurePhysMemTotal) > 0.8
IfTrueAction=[!SetVariable Alert2 "Memory high,"]
IfFalseAction=[!SetVariable Alert2 ""]

[measureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
IfAboveValue=25
IfAboveAction=[!SetVariable Alert3 ""]
IfBelowValue=26
IfBelowAction=[!SetVariable Alert3 "Battery low"]



