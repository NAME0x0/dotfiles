[Rainmeter]
Update=5000
BackgroundMode=1
Group=all
DefaultAlwaysOnTop=-2

[Metadata]
Name=Text clock
Author=Immanuel Smith
Information=Displays the current date and time in 24hrs.
License=Creative Commons BY-NC-SA 3.0
Version=1.0

[Variables]
@include=#@#settings.inc
scale=0.69
@include2=#@#Styles\styles.inc
title=
title2=
width=400
height=180
autoscale=0
@include3=#@#Styles\background_local.inc

[MeasureData]
Measure=Script
ScriptFile=#@#Scripts\textclock.lua

[measureDate1]
Measure=Time
Format=%A %d %B %Y

[MeterBorder]
Meter=Shape
MeterStyle=StyleMeterBorderTop

[meterDate1]
Meter=String
MeterStyle=StyleSecondText
MeasureName=measureDate1
X=(200*#scale#)
Y=(27*#scale#)
W=(400*#scale#)
H=(26*#scale#)
FontColor=#HighlightTextColor#
Text=%1
FontSize=(13*#scale#)
Percentual=#percentual#
StringCase=Upper
StringAlign=centercenter

[meterData]
Meter=String
MeterStyle=StyleMainText
MeasureName=measureData
FontFace=Moongloss Display Medium
FontColor=#HighlightTextColor#
X=(200*#scale#)
Y=(90*#scale#)
W=(370*#scale#)
H=(150*#scale#)
Text=%1
FontSize=(25*#scale#)
StringAlign=centercenter
Percentual=#percentual#
ClipString=2







