[MeterJoke1]
Meter=STRING
MeterStyle=StyleText
MeasureName=MeasureUserName
X=10
Y=5R
Text="%UserProfile%> cd c:\windows\system32"

[MeterJoke2]
Meter=STRING
MeterStyle=StyleText
X=0r
Y=0R
Text="C:\WINDOWS\system32> del *"

[MeterJoke3]
Meter=STRING
MeterStyle=StyleText
X=0r
Y=0R
Text="C:\WINDOWS\system32\*, Are you sure (Y/N)? y"

[MeterJoke4]
Meter=STRING
MeterStyle=StyleText
X=0r
Y=0R
